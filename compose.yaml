name: paxth-qa

services:
  app:
    build: .
    image: paxth-qa:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3200:3000"
    cpus: 1.0
    mem_limit: 1536m
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
